[project]
name = "cai-service"
version = "0.1.0"
description = "CineMate AI Service using FastAPI, LangGraph, FastMCP, and Groq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "sse-starlette>=2.1.3",
    "langgraph>=0.2.50",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-community>=0.3.5",
    "langchain-groq>=0.2.1",
    "groq>=0.11.0",
    "langchain-openai>=0.2.5",
    "langchain-google-genai>=2.0.4",
    "fastmcp>=0.1.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
]

